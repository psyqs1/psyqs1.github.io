<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Style/Style.css">
    <script type="module" src="../Modules/SB.js"></script>
    <script type="module" src="../Modules/PeopleSearchMain.js"></script>
    <title>People Search</title>
</head>

<body>
    <div class="container" id="container">
        <header>
            <h1>People Search!</h1>

            <ul class="navbar"> 
                <li class="selected"><a href="">People search</a></li>
                <li><a href="../Pages/VehicleSearch.html">Vehicle search</a></li>
                <li><a href="../Pages/AddVehicle.html">Add a vehicle</a></li>
            </ul>
        </header>

        <aside>
            <img src="../Assets/Website/JovialMerryment.png" alt="Image of a triumphant orange horse.">
        </aside>

        <main>
            <form class="peopleSearch">
                <label for="name">Search by driver name:</label>
                <input type="text" id="name" required>
                <label for="license">Search by driving license number:</label>
                <input type="text" id="license" required>
                <button type="button" id="submit" disabled>Submit</button>
              </form>

              <div class="message" id="message">&nbsp</div>

              <div class="results" id="results">
              </div>
        </main>

        <footer>This is a sample for the COMP1004 coursework, by Quentin Schmuziger (psyqs1)</footer>
    </div>
</body>

</html>
